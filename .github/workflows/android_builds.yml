name: Android release builds

on:
  release:
    types: [published]
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android_builds.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android_builds.yml'
  workflow_dispatch:
    inputs:
      debug:
        type: boolean
        description: Debuggable build?
        default: false

permissions:
  contents: read

jobs:
  format:
    name: Formatting check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "jetbrains"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
    
      - name: Set up local.properties
        working-directory: android
        run: |
          echo -e 'MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}\nsigning.storeFilePath=/tmp/keystore\nsigning.keyPassword=${{ secrets.STORE_PAS$

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Check formatting
        id: format_check
        working-directory: android
        run: |
          ./gradlew spotlessCheck

  publish:
    name: Build APK/AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "jetbrains"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Configuration
        id: config
        run: |
          export debug=${{ inputs.debug && 'debug' || 'release' }}
          echo "debug=$debug" >> $GITHUB_OUTPUT
          echo "build_command=bundle${DEBUG_OR_RELEASE^} assemble${DEBUG_OR_RELEASE^}" >> $GITHUB_OUTPUT
          echo "aabPath=./android/app/build/outputs/bundle/${DEBUG_OR_RELEASE}/*.aab" >> $GITHUB_OUTPUT
          echo "apkPath=./android/app/build/outputs/apk/${DEBUG_OR_RELEASE}/*.apk" >> $GITHUB_OUTPUT
        env:
          DEBUG_OR_RELEASE: ${{ inputs.debug && 'debug' || 'release' }}

      - name: Put keystore in place on filesystem to allow for signing builds
        working-directory: android
        run: echo "${{ secrets.KEYSTORE_CONTENT }}" | base64 --decode > /tmp/keystore

      - name: Set up local.properties
        working-directory: android
        run: |
          echo -e 'MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}\nsigning.storeFilePath=/tmp/keystore\nsigning.keyPassword=${{ secrets.STORE_PASSWORD }}\nsigning.storePassword=${{ secrets.STORE_PASSWORD }}\nsigning.keyAlias=android' > local.properties

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build AAB and APK with Gradle
        working-directory: android
        run: ./gradlew --refresh-dependencies ${{steps.config.outputs.build_command}}

      - name: Upload AAB artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.debug && 'debug' || 'release' }} AAB
          if-no-files-found: error
          path: ${{ steps.config.outputs.aabPath }}

      - name: Upload APK artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.debug && 'debug' || 'release' }} APK
          if-no-files-found: error
          path: ${{ steps.config.outputs.apkPath }}

      - name: Upload build artifacts to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.config.outputs.aabPath }}
            ${{ steps.config.outputs.apkPath }}
